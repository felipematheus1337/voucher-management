
spring:
  application:
    name: voucher
  data:
    mongodb:
      uri: mongodb://root:root@localhost:27017/vouchersdb?authSource=admin
  cache:
    type: redis
    redis:
      host: localhost
      port: 6379
      password: 123456
      timeout: 2000
      jedis:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
          max-wait: -1
  kafka:
    producer:
      bootstrap-servers: localhost:29092
    consumer:
      bootstrap-servers: localhost:29092